name: Napravi ključ za potpis

# Jednokratno: pravi ključ za potpis zvaničnih izdanja, za slučaj da na računaru nema keytool-a.
# Pokreće se ručno (Actions → Napravi ključ za potpis → Run workflow), pošto se prvo doda secret
# RELEASE_KEYSTORE_PASSWORD. Ključ se preuzima kao artifact (briše se posle jednog dana), čuva na
# sigurnom mestu, a sadržaj fajla sa base64 zapisom ide u secret RELEASE_KEYSTORE_BASE64.
# Ključ nikad ne ulazi u repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    name: Ključ za potpis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Napravi ključ
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          EXISTING: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$EXISTING" ]; then
            echo "Secret RELEASE_KEYSTORE_BASE64 već postoji. Novi ključ ne bi mogao da ažurira već izdate verzije, pa se ne pravi."
            exit 1
          fi
          if [ "${#RELEASE_KEYSTORE_PASSWORD}" -lt 8 ]; then
            echo "Prvo dodaj secret RELEASE_KEYSTORE_PASSWORD (najmanje 8 znakova)."
            exit 1
          fi
          mkdir out
          # Lozinka ide kroz promenljivu okruženja, ne kroz komandnu liniju, da se ne vidi u ispisu.
          keytool -genkeypair -keystore out/release.jks -storetype PKCS12 -alias release \
            -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=IPTV Player" \
            -storepass:env RELEASE_KEYSTORE_PASSWORD -keypass:env RELEASE_KEYSTORE_PASSWORD
          base64 -w0 out/release.jks > out/RELEASE_KEYSTORE_BASE64.txt

      - uses: actions/upload-artifact@v6
        with:
          name: kljuc-za-potpis
          path: out/
          retention-days: 1
          if-no-files-found: error
