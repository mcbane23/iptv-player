name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write je potreban da bi build objavio pre-release sa APK-om
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Testovi, lint i debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Debug APK kao artifact
        uses: actions/upload-artifact@v6
        with:
          name: iptv-player-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Stalan link ka poslednjem APK-u (zgodno za TV): tag dev-latest se pomera na svaki push.
      - name: Objavi pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk iptv-player-debug.apk
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest iptv-player-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Poslednji debug build (#${{ github.run_number }})" \
            --notes "Grana: ${{ github.ref_name }}, commit: ${GITHUB_SHA::7}. Automatski build, potpisan debug ključem."

      - name: Izveštaji (lint, testovi)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
