name: Build

# Samo push: PR na github-u prikazuje rezultat push builda za isti commit,
# pa poseban pull_request build bi samo gradio isti kod drugi put.
on:
  push:
    branches: ['**']
  # Ručno pokretanje na main-u (Actions → Build → Run workflow) ponovo objavljuje APK,
  # npr. kad GitHub ne pokrene build posle spajanja.
  workflow_dispatch:

# Na granama novi push prekida stari build. Na main-u se build ne prekida: prekid usred objave
# ostavlja u javnom repou opis jednog builda i APK drugog, pa aplikacija odbije ažuriranje kao oštećeno.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  # write je potreban da bi build objavio pre-release sa APK-om
  contents: write

# Tri posla rade paralelno: „apk” što pre pravi i objavljuje APK, „provere” radi testove i lint,
# „release” proverava da release build (R8) prolazi. CI je zelen tek kad sva tri prođu.
jobs:
  apk:
    name: Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # Cela istorija je potrebna za proveru da li grana sadrži vrh main-a (vidi „Objavi pre-release”).
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Ključevi Trakt aplikacije (GitHub Secrets) ugrađuju se u APK. Bez Client ID-ja Trakt se ne prikazuje;
      # Client Secret nije obavezan (nove Trakt aplikacije ga nemaju).
      # Build „dev”: optimizovan kao izdanje (R8), potpisan debug ključem (vidi app/build.gradle.kts).
      - name: Test APK
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: ./gradlew assembleDev

      # APK se objavljuje samo sa main-a (posle spajanja). Na granama build služi samo kao provera.
      - name: Test APK kao artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: iptv-player-debug-${{ github.run_number }}
          path: app/build/outputs/apk/dev/*.apk
          if-no-files-found: error

      # Stalan link ka poslednjem APK-u sa main-a (zgodno za TV): tag dev-latest se pomera na svaki
      # push na main.
      - name: Objavi pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/dev/app-dev.apk iptv-player-debug.apk
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest iptv-player-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Poslednji test build (#${{ github.run_number }})" \
            --notes "Commit: ${GITHUB_SHA::7}. Automatski optimizovan build (R8), potpisan debug ključem."

      # Isti APK ide i u javni repo za APK-ove, odakle ga aplikacija sama preuzima (Podešavanja → Proveri
      # ažuriranje). Kod ostaje privatan. Token APK_REPO_TOKEN ima pravo pisanja samo u taj repo; bez njega
      # se korak preskače. Repo i tag moraju biti isti kao u data/update/UpdateSource.kt.
      # Samo main: aplikacija ne sme da nudi buildove sa nespojenih grana.
      - name: Objavi u javni repo za ažuriranje
        if: github.ref == 'refs/heads/main'
        env:
          APK_REPO_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
          APK_REPO: mcbane23/apps
          TAG: iptv-player-dev
          BRANCH: ${{ github.ref_name }}
          CODE: ${{ github.run_number }}
        run: |
          if [ -z "$APK_REPO_TOKEN" ]; then
            echo "Secret APK_REPO_TOKEN ne postoji, javni repo se ne menja."
            exit 0
          fi
          # Dva builda mogu da se završe obrnutim redom: stariji ne sme da zameni noviji.
          CURRENT=$(curl -fsSL "https://github.com/$APK_REPO/releases/download/$TAG/iptv-player.json" 2>/dev/null | jq -r '.versionCode // 0' 2>/dev/null)
          if [ "${CURRENT:-0}" -ge "$CODE" ]; then
            echo "U javnom repou je već build #$CURRENT, ne menjam ga."
            exit 0
          fi
          export GH_TOKEN="$APK_REPO_TOKEN"
          # Svaki build ima svoj fajl. Da se isti fajl menja u mestu, aplikacija koja je već pročitala
          # stari opis preuzela bi novi APK, kontrolni zbir se ne bi poklopio i ažuriranje bi bilo odbijeno.
          APK="iptv-player-dev-$CODE.apk"
          cp app/build/outputs/apk/dev/app-dev.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          # versionName mora da prati app/build.gradle.kts.
          jq -n --argjson code "$CODE" --arg name "0.0.1-dev.$CODE" --arg apk "$APK" --arg sha "$SHA" --arg commit "${GITHUB_SHA::7}" \
            '{versionCode: $code, versionName: $name, apk: $apk, sha256: $sha, commit: $commit}' \
            > iptv-player.json
          if ! gh release view "$TAG" -R "$APK_REPO" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$APK_REPO" --prerelease \
              --title "IPTV plejer (dev)" --notes "Automatski build."
          fi
          # Prvo APK, pa opis: aplikacija vidi novu verziju tek kad je APK već na mestu.
          gh release upload "$TAG" -R "$APK_REPO" "$APK" --clobber
          gh release upload "$TAG" -R "$APK_REPO" iptv-player.json --clobber
          gh release edit "$TAG" -R "$APK_REPO" \
            --notes "Build #$CODE, grana: $BRANCH, commit: ${GITHUB_SHA::7}. Automatski optimizovan build (R8), potpisan debug ključem."
          # Stari APK-ovi se brišu tek sada, kad opis već pokazuje na novi. Prethodni build ostaje
          # još jedan krug, za aplikaciju koja je upravo pročitala stari opis.
          PREVIOUS="iptv-player-dev-${CURRENT:-0}.apk"
          gh release view "$TAG" -R "$APK_REPO" --json assets --jq '.assets[].name' \
            | grep -E '^iptv-player-dev(-[0-9]+)?\.apk$' \
            | grep -vxF -e "$APK" -e "$PREVIOUS" \
            | while read -r OLD; do
                gh release delete-asset "$TAG" "$OLD" -R "$APK_REPO" --yes || true
              done

  provere:
    name: Testovi i lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Testovi i lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Izveštaji (lint, testovi)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  # Zvanična izdanja pravi release.yml (samo na oznaku v*). Ovde se samo proverava da R8 i smanjivanje
  # resursa prolaze, da se greška ne otkrije tek na dan izdanja. APK je nepotpisan i ne objavljuje se.
  release:
    name: Release build (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Release build
        run: ./gradlew assembleRelease
