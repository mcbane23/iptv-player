name: Release

# Zvanično izdanje, potpuno automatski: kad se u main spoji izmena fajla version.txt (npr. 1.0.0 u
# 1.0.1), a oznaka v<verzija> još ne postoji, pravi se potpisan release APK. Oznaku pravi sam
# workflow, na commitu koji je upravo spojen. Ako oznaka već postoji, ne radi ništa.
# APK se objavljuje u GitHub Releases ovog repoa i u javni repo iz kog aplikacija preuzima
# ažuriranja (kanal iptv-player, vidi data/update/UpdateSource.kt).
#
# Potrebni GitHub Secrets (nikad u repou):
#   RELEASE_KEYSTORE_BASE64    keystore fajl kao base64 (base64 -w0 release.jks)
#   RELEASE_KEYSTORE_PASSWORD  lozinka keystore-a
#   RELEASE_KEY_ALIAS          ime ključa (nije obavezno, podrazumevano „release”)
#   RELEASE_KEY_PASSWORD       lozinka ključa (nije obavezno, podrazumevano ista kao lozinka keystore-a)
#   APK_REPO_TOKEN             pisanje u javni repo (isti kao u build.yml)
on:
  push:
    branches: [main]
    # I izmena samog workflow-a ga pokreće, da ispravka posle neuspelog izdanja ne traži novu verziju.
    paths: [version.txt, .github/workflows/release.yml]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Verzija
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      needed: ${{ steps.read.outputs.needed }}
    steps:
      - uses: actions/checkout@v5

      - name: Pročitaj verziju
        id: read
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          if ! [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "version.txt mora da sadrži verziju oblika 1.2.3, a piše: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Izdanje v$VERSION već postoji, ništa se ne pravi."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Izdanje
    needs: version
    if: needs.version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Cela istorija: broj builda je broj commitova u main-u.
          fetch-depth: 0

      # Isto brojanje verzija kao u build.yml (vidi app/build.gradle.kts), da test build i izdanje
      # mogu jedno preko drugog.
      - name: Broj builda
        run: echo "APP_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Ključ za potpis
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for NAME in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD; do
            if [ -z "${!NAME}" ]; then
              echo "Secret $NAME ne postoji. Izdanje se ne pravi bez ključa za potpis."
              exit 1
            fi
          done
          # Maska važi i kad vrednost ne dolazi iz secreta nego iz podrazumevane.
          KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-$RELEASE_KEYSTORE_PASSWORD}"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS:-release}"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          # Secret nalepljen iz fajla često nosi razmake ili prelome reda (npr. Windows \r), a base64 -d
          # na njima pada, pa se beline prvo uklanjaju.
          if ! printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"; then
            echo "RELEASE_KEYSTORE_BASE64 nije ispravan base64. Nalepi ponovo ceo sadržaj fajla RELEASE_KEYSTORE_BASE64.txt."
            exit 1
          fi
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Testovi i release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Obriši ključ sa diska
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # Nepotpisan ili debug ključem potpisan APK ne sme da izađe kao izdanje.
      - name: Provera potpisa
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "Nema potpisanog APK-a ($APK)."
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "APK je potpisan debug ključem."
            exit 1
          fi
          cp "$APK" "iptv-player-$RELEASE_VERSION.apk"

      - name: Objavi izdanje
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Oznaka se pravi ovde, na commitu koji je upravo izgrađen.
          gh release create "$TAG" "iptv-player-$RELEASE_VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "Izdanje $RELEASE_VERSION" \
            --generate-notes

      # Isti APK ide u javni repo, u kanal „iptv-player”, odakle ga preuzimaju zvanična izdanja aplikacije.
      # Dev buildovi prate svoj kanal (iptv-player-dev) i ovo ih ne dira.
      - name: Objavi u javni repo za ažuriranje
        env:
          APK_REPO_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
          APK_REPO: mcbane23/apps
          CHANNEL: iptv-player
        run: |
          if [ -z "$APK_REPO_TOKEN" ]; then
            echo "Secret APK_REPO_TOKEN ne postoji, javni repo se ne menja."
            exit 0
          fi
          # Mora da prati račun u app/build.gradle.kts.
          CODE=$((1000000 + APP_BUILD_NUMBER))
          CURRENT=$(curl -fsSL "https://github.com/$APK_REPO/releases/download/$CHANNEL/iptv-player.json" 2>/dev/null | jq -r '.versionCode // 0' 2>/dev/null)
          if [ "${CURRENT:-0}" -ge "$CODE" ]; then
            echo "U javnom repou je već verzija $CURRENT, ne menjam je."
            exit 0
          fi
          export GH_TOKEN="$APK_REPO_TOKEN"
          SHA=$(sha256sum "iptv-player-$RELEASE_VERSION.apk" | cut -d' ' -f1)
          jq -n --argjson code "$CODE" --arg name "$RELEASE_VERSION" --arg apk "iptv-player-$RELEASE_VERSION.apk" --arg sha "$SHA" --arg commit "${GITHUB_SHA::7}" \
            '{versionCode: $code, versionName: $name, apk: $apk, sha256: $sha, commit: $commit}' \
            > iptv-player.json
          if ! gh release view "$CHANNEL" -R "$APK_REPO" > /dev/null 2>&1; then
            gh release create "$CHANNEL" -R "$APK_REPO" \
              --title "IPTV plejer" --notes "Zvanična izdanja."
          fi
          # Prvo APK, pa opis: aplikacija vidi novu verziju tek kad je APK već na mestu.
          gh release upload "$CHANNEL" -R "$APK_REPO" "iptv-player-$RELEASE_VERSION.apk" --clobber
          gh release upload "$CHANNEL" -R "$APK_REPO" iptv-player.json --clobber
          gh release edit "$CHANNEL" -R "$APK_REPO" \
            --notes "Verzija $RELEASE_VERSION, commit: ${GITHUB_SHA::7}."

  # Stalna adresa za ručno preuzimanje (npr. aplikacija Downloader na televizoru):
  #   https://github.com/mcbane23/apps/releases/download/iptv-player/glowbox.apk
  # Fajl glowbox.apk je kopija APK-a na koji pokazuje iptv-player.json. Aplikacija ga ne koristi:
  # ona preuzima fajl čije ime piše u opisu, pa zamena ovog fajla u mestu ne kvari ažuriranje.
  # Posao radi i kad novo izdanje nije potrebno, pa izmena ovog workflow-a dopuni i postojeće izdanje.
  fixed-name:
    name: Stalni link za preuzimanje
    needs: [version, release]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kopiraj poslednje izdanje u glowbox.apk
        env:
          APK_REPO_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
          APK_REPO: mcbane23/apps
          CHANNEL: iptv-player
          FIXED: glowbox.apk
        run: |
          if [ -z "$APK_REPO_TOKEN" ]; then
            echo "Secret APK_REPO_TOKEN ne postoji, javni repo se ne menja."
            exit 0
          fi
          export GH_TOKEN="$APK_REPO_TOKEN"
          # Fajlovi se čitaju preko API-ja (gh), a ne preko javnog linka za preuzimanje: javni link
          # ume da još nekoliko minuta vraća stari opis, pa bi glowbox.apk ostao na prethodnoj verziji.
          fetch() { gh release download "$CHANNEL" -R "$APK_REPO" --pattern "$1" --output "$2" --clobber; }
          if ! fetch iptv-player.json manifest.json; then
            echo "U javnom repou još nema izdanja."
            exit 0
          fi
          APK=$(jq -r '.apk' manifest.json)
          SHA=$(jq -r '.sha256' manifest.json)
          if ! [[ "$APK" =~ ^[A-Za-z0-9._-]+\.apk$ ]] || ! [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Opis izdanja nije ispravan."
            exit 1
          fi
          if fetch "$FIXED" current.apk 2>/dev/null \
            && [ "$(sha256sum current.apk | cut -d' ' -f1)" = "$SHA" ]; then
            echo "$FIXED je već verzija $(jq -r '.versionName' manifest.json)."
            exit 0
          fi
          fetch "$APK" "$FIXED"
          if [ "$(sha256sum "$FIXED" | cut -d' ' -f1)" != "$SHA" ]; then
            echo "Preuzeti APK se ne poklapa sa kontrolnim zbirom iz opisa."
            exit 1
          fi
          gh release upload "$CHANNEL" -R "$APK_REPO" "$FIXED" --clobber
          echo "$FIXED je sada verzija $(jq -r '.versionName' manifest.json)."
